<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Amarah Farms</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="gallery">
    <div id="site-header"></div>
    <main>
      <section class="page-hero gallery-hero">
        <div class="container">
          <span class="eyebrow light">A LOOK BEHIND THE SCENES</span>
          <h1>Our Gallery</h1>
          <p>
            A visual journey from sourcing and processing to packaging and
            delivery.
          </p>
        </div>
      </section>
      <section class="section container">
        <div class="filter-row" role="group" aria-label="Filter gallery">
          <button class="filter-btn active" data-filter="all">All</button
          ><button class="filter-btn" data-filter="sourcing">
            Farm & sourcing</button
          ><button class="filter-btn" data-filter="processing">
            Processing</button
          ><button class="filter-btn" data-filter="packaging">Packaging</button
          ><button class="filter-btn" data-filter="delivery">Delivery</button
          ><button class="filter-btn" data-filter="team">Team</button>
        </div>
        <div class="gallery-grid">
          <figure data-category="sourcing">
            <img src="img/source1.jpg" alt="Product sourcing" />
            <figcaption>Careful sourcing</figcaption>
          </figure>
          <figure data-category="processing">
            <img src="img/processing.jfif" alt="Chicken processing" />
            <figcaption>Chicken preparation</figcaption>
          </figure>
          <figure data-category="processing">
            <img src="img/seafoodp.jpg" alt="Seafood processing" />
            <figcaption>Seafood preparation</figcaption>
          </figure>
          <figure data-category="packaging">
            <img src="img/pack3.jpg" alt="Order packaging" />
            <figcaption>Packaging & quality checks</figcaption>
          </figure>
          <figure data-category="delivery">
            <img src="img/delivery212.jfif" alt="Delivery in Nairobi" />
            <figcaption>Delivery across Nairobi</figcaption>
          </figure>
          <figure data-category="team">
            <img src="img/team del.png" alt="Team at work" />
            <figcaption>Our team at work</figcaption>
          </figure>
          <figure data-category="processing">
            <img src="img/seaff2.jpg" alt="Fresh seafood" />
            <figcaption>Fresh seafood selection</figcaption>
          </figure>
          <figure data-category="processing">
            <img src="img/procs.jpg" alt="Fresh chicken" />
            <figcaption>Fresh chicken selection</figcaption>
          </figure>
          <figure data-category="team">
            <img src="img/call center.png" alt="Customer care" />
            <figcaption>Customer care</figcaption>
          </figure>
          <figure data-category="packaging">
            <img src="img/pack4.jfif" alt="Cold storage" />
            <figcaption>Cold storage</figcaption>
          </figure>
          <figure data-category="delivery">
            <img src="img/kama.png" alt="Delivery team" />
            <figcaption>Our delivery team</figcaption>
          </figure>
          <figure data-category="sourcing">
            <img src="img/proces3.jpg" alt="Quality inspection" />
            <figcaption>Quality checks</figcaption>
          </figure>
        </div>
      </section>
      <section class="wide-cta">
        <div class="container wide-cta-inner">
          <div>
            <span class="eyebrow light">FRESHNESS IN EVERY ORDER</span>
            <h2>Shop our range</h2>
            <p>Chicken and seafood for every table.</p>
          </div>
          <a class="btn btn-white" href="products.html">Shop products ↗</a>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/app.js"></script>
  </body>
</html>
